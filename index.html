<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Document</title>

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
</head>

<body>

    <a-scene embedded arjs="sourceType: webcam">

        <a-marker preset="kanji">

            <a-box
                position="1 0.5 0"
                color="skyblue">
            </a-box>

        </a-marker>

        <a-marker preset="hiro">

             <!-- ミッフィー -->

        <a-entity
        scale="0.45 0.45 0.45"
        position="0 1.3 0">
        <a-cylinder
        position="0 -2.7 0 "
        radius="1"
        height="0.3"
        color="dimgray"
        ></a-cylinder>

        <a-sphere
        color="white"
        radius="1.1"
        ></a-sphere>

        <a-cone
        position="0 -1.5 0"
        color="orange"
        radius-top="0.6"
        height="1.2"
        ></a-cone>

        <a-cylinder
        position="-0.4 -2.5 0 "
        radius="0.27"
        height="0.6"
        ></a-cylinder>

        <a-cylinder
        position="0.4 -2.5 0 "
        radius="0.27"
        height="0.6"
        ></a-cylinder>

        <a-cylinder
        position="1 -1.5 0 "
        radius="0.23"
        height="0.7"
        rotation="0 0 90"
        ></a-cylinder>

        <a-cylinder
        position="-1 -1.5 0 "
        radius="0.23"
        height="0.7"
        rotation="0 0 90"
        ></a-cylinder>

        <a-cylinder
        position="0.6 1.2 0 "
        radius="0.3"
        height="1.2"
        rotation="0 0 -10"
            ></a-cylinder>

            <a-cylinder
            position="-0.6 1.2 0 "
            radius="0.3"
            height="1.2"
            rotation="0 0 10"
            ></a-cylinder>

            <!-- 目 -->
            <a-sphere
            position="0.3 0.2 1.1"
            radius="0.09"
            color="black"
            ></a-sphere>
            <a-sphere
            position="-0.3 0.2 1.1"
            radius="0.09"
            color="black"
            ></a-sphere>

            <!-- ボタン -->
            <a-sphere
            position="0 -1.1 0.7"
            radius="0.1"
            color="yellow"
            ></a-sphere>
            
            <!-- 口 -->
            <a-box
            position="0 -0.1 1.1"
            color="black"
            depth="0.1"
            width="0.3"
            height="0.02"
            rotation="0 0 30"
            ></a-box>

            <a-box
            position="0 -0.1 1.1"
            color="black"
            depth="0.1"
            width="0.3"
            height="0.02"
            rotation="0 0 -30"
            ></a-box>
            
        </a-entity>

        </a-marker>

        <a-entity camera></a-entity>

    </a-scene>

</body>

</html>
