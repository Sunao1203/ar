<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>AR</title>

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>

    <style>
        #hud {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 999;
        }

        select {
            font-size: 18px;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        button {
            font-size: 20px;
            padding: 12px 20px;
            border: none;
            background-color: royalblue;
            color: white;
            border-radius: 10px;
            margin-right: 10px;
        }
    </style>
</head>


<body>

    <div id="hud">

        <!-- 人 -->
        <select id="humanSelect">
            <option value="CharacterArmature|Idle">人</option>
            <option value="CharacterArmature|Walk">人：歩く</option>
            <option value="CharacterArmature|Run">人：走る</option>
            <option value="CharacterArmature|Wave">人：手を振る</option>
        </select>

        <br>

        <!-- 柴犬 -->
        <select id="shibaSelect">
            <option value="AnimalArmature|Idle">柴犬</option>
            <option value="AnimalArmature|Walk">柴犬：歩く</option>
            <option value="AnimalArmature|Eating">柴犬：食べる</option>
            <option value="AnimalArmature|Gallop">柴犬：走る</option>
        </select>

        <br>

        <!-- ハスキー -->
        <select id="huskySelect">
            <option value="AnimalArmature|Idle">ハスキー</option>
            <option value="AnimalArmature|Walk">ハスキー：歩く</option>
            <option value="AnimalArmature|Eating">ハスキー：食べる</option>
            <option value="AnimalArmature|Gallop">ハスキー：走る</option>
        </select>

        <br>

        <button id="enlargeButton">拡大</button>
        <button id="rotateButton">回転</button>

    </div>


    <a-scene embedded arjs="sourceType: webcam">

        <a-marker preset="hiro" smooth="true">

            <!-- AIに三つをまとめる方法を聞きました -->
            <a-entity
                id="model"
                position="0 0 0.5">

                <!-- 人 -->
                <a-gltf-model
                    id="human"
                    src="Adventurer.glb"
                    position="0 0 0"
                    scale="0.3 0.3 0.3"
                    rotation="-90 0 0"
                    animation-mixer="clip: CharacterArmature|Idle">
                </a-gltf-model>


                <!-- 柴犬 -->
                <a-gltf-model
                    id="shiba"
                    src="Shiba.glb"
                    position="-1 0 0"
                    scale="0.3 0.3 0.3"
                    rotation="-90 0 0"
                    animation-mixer="clip: AnimalArmature|Idle">
                </a-gltf-model>


                <!-- ハスキー -->
                <a-gltf-model
                    id="husky"
                    src="Husky.glb"
                    position="1 0 0"
                    scale="0.3 0.3 0.3"
                    rotation="-90 0 0"
                    animation-mixer="clip: AnimalArmature|Idle">
                </a-gltf-model>

            </a-entity>

        </a-marker>

        <a-entity camera></a-entity>

    </a-scene>


    <script>
        const human = document.getElementById("human");
        const shiba = document.getElementById("shiba");
        const husky = document.getElementById("husky");

        const humanSelect = document.getElementById("humanSelect");
        const shibaSelect = document.getElementById("shibaSelect");
        const huskySelect = document.getElementById("huskySelect");

        const model = document.getElementById("model");
        const enlargeButton = document.getElementById("enlargeButton");
        const rotateButton = document.getElementById("rotateButton");

        function changeHumanAnimation() {

            human.setAttribute(
                "animation-mixer",
                "clip",
                humanSelect.value
            );

        }

        humanSelect.addEventListener(
            "change",
            changeHumanAnimation
        );

        function changeShibaAnimation() {

            shiba.setAttribute(
                "animation-mixer",
                "clip",
                shibaSelect.value
            );

        }

        shibaSelect.addEventListener(
            "change",
            changeShibaAnimation
        );

        function changeHuskyAnimation() {

            husky.setAttribute(
                "animation-mixer",
                "clip",
                huskySelect.value
            );

        }

        huskySelect.addEventListener(
            "change",
            changeHuskyAnimation
        );








        let size = 1;

        function enlargeModel() {

            size = size + 0.1;

            model.setAttribute(
                "scale",
                `${size} ${size} ${size}`
            );

        }

        enlargeButton.addEventListener(
            "click",
            enlargeModel
        );






        
        let angle = 0;

        function rotateModel() {

            angle += 15;

            model.setAttribute(
                "rotation",
                `0 0 ${angle}`
            );

        }

        rotateButton.addEventListener(
            "click",
            rotateModel
        );

    </script>

</body>

</html>
