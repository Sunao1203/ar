
<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>魔法陣AR</title>

    <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.6.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/projapayuri/aframe-gesture-hands@v0.9.2/aframe-gesture-hands.js"></script>

    <style>
        #hud {
            position: fixed;
            left: 20px;
            top: 20px;
            z-index: 999;
        }

        button {
            font-size: 18px;
            padding: 18px 10px;
        }
    </style>
</head>

<body>

    <div id="hud">
        <button id="circle1Btn">魔法陣1</button>
        <button id="circle2Btn">魔法陣2</button>
    </div>

    <a-scene hands>

        <a-entity hand-anchor="index:9">

            <a-gltf-model
                id="circle"
                src="magic_circle/c_cyan.glb"
                animation-mixer="clip:MagicCircle_Loop"
                scale="2 2 2"
                position="0 1 0">
            </a-gltf-model>

        </a-entity>

    </a-scene>

    <script>
        const circle = document.getElementById("circle");
        const circle1Btn = document.getElementById("circle1Btn");
        const circle2Btn = document.getElementById("circle2Btn");

        const circleSound = new Audio("magic_circle/circle.mp3");

        function playSound() {
            circleSound.currentTime = 0;
            circleSound.play();
        }

        function changeCircle1() {
            circle.setAttribute("src", "magic_circle/c_cyan.glb");
            playSound();
        }

        function changeCircle2() {
            circle.setAttribute("src", "magic_circle/c_gold.glb");
            playSound();
        }

        circle1Btn.addEventListener("click", changeCircle1);
        circle2Btn.addEventListener("click", changeCircle2);

    </script>

</body>
</html>
