
<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>糸島AR観光</title>

    <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.6.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/projapayuri/aframe-gesture-hands@v0.9.2/aframe-gesture-hands.js"></script>

</head>

<body>

    <a-scene hands id="scene">

        <!-- 動画を用意する -->
        <a-assets>
            <video
                id="video"
                src="intro.mp4"
                autoplay
                muted
                playsinline>
            </video>
        </a-assets>

        <!-- 動画を表示する -->
        <a-video
            src="#video"
            width="3.2"
            height="1.8"
            position="0 0.5 -2.5">
        </a-video>

        <!-- またいちのしお -->
        <a-plane
            id="salt"
            color="#f2d59b"
            width="0.75"
            height="0.45"
            position="-1.2 -0.7 -2.5">
        </a-plane>

        <a-text
            value="Pudding"
            align="center"
            color="black"
            width="2"
            position="-1.2 -0.7 -2.49">
        </a-text>

        <!-- 夫婦岩 -->
        <a-plane
            id="sea"
            color="#a7d8ee"
            width="0.75"
            height="0.45"
            position="-0.4 -0.7 -2.5">
        </a-plane>

        <a-text
            value="Sea"
            align="center"
            color="black"
            width="2"
            position="-0.4 -0.7 -2.49">
        </a-text>

        <!-- 白糸の滝 -->
        <a-plane
            id="falls"
            color="#a7d8c1"
            width="0.75"
            height="0.45"
            position="0.4 -0.7 -2.5">
        </a-plane>

        <a-text
            value="Waterfall"
            align="center"
            color="black"
            width="2"
            position="0.4 -0.7 -2.49">
        </a-text>

        <!-- 立石山 -->
        <a-plane
            id="mountain"
            color="#eeb2a1"
            width="0.75"
            height="0.45"
            position="1.2 -0.7 -2.5">
        </a-plane>

        <a-text
            value="Mountain"
            align="center"
            color="black"
            width="2"
            position="1.2 -0.7 -2.49">
        </a-text>

        <a-camera position="0 0 0"></a-camera>

    </a-scene>

    <script>
        const scene = document.getElementById("scene");
        const video = document.getElementById("video");

        const salt = document.getElementById("salt");
        const sea = document.getElementById("sea");
        const falls = document.getElementById("falls");
        const mountain = document.getElementById("mountain");

        let wasSaltInside = false;
        let wasSeaInside = false;
        let wasFallsInside = false;
        let wasMountainInside = false;

        function changeVideo() {
            const saltInside =
                scene.components.hands.isPointOnEntity(8, salt);

            const seaInside =
                scene.components.hands.isPointOnEntity(8, sea);

            const fallsInside =
                scene.components.hands.isPointOnEntity(8, falls);

            const mountainInside =
                scene.components.hands.isPointOnEntity(8, mountain);

            if (saltInside && !wasSaltInside) {
                video.setAttribute("src", "salt_pudding.mp4");
                video.play();
            }

            if (seaInside && !wasSeaInside) {
                video.setAttribute("src", "futamigaura_sunset.mp4");
                video.play();
            }

            if (fallsInside && !wasFallsInside) {
                video.setAttribute("src", "shiraito_falls.mp4");
                video.play();
            }

            if (mountainInside && !wasMountainInside) {
                video.setAttribute("src", "tateishiyama.mp4");
                video.play();
            }

            wasSaltInside = saltInside;
            wasSeaInside = seaInside;
            wasFallsInside = fallsInside;
            wasMountainInside = mountainInside;
        }

        scene.addEventListener("hand-result", changeVideo);

    </script>

</body>
</html>
